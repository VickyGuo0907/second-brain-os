name: Build and deploy website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-site.txt

      - name: Install site dependencies
        run: python -m pip install -r tools/requirements-site.txt

      - name: Rebuild all website data and pages
        run: |
          python tools/build_graph_site.py
          python tools/extract_site.py
          python tools/build_site.py
          python scripts/build_tree.py

      - name: Check generated content
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def read_data(path, variable):
              text = Path(path).read_text(encoding="utf-8")
              return json.loads(text.split(variable + "=", 1)[1].strip().removesuffix(";"))

          graph = read_data("assets/site/graph-data.js", "window.SBOS_GRAPH")
          pages = read_data("assets/site/pages-data.js", "window.SBOS_PAGES")
          node_ids = {node["id"] for node in graph["nodes"]}
          tree = Path("tree.html").read_text(encoding="utf-8")
          expected = {
              str(path.relative_to("docs").with_suffix(""))
              for path in Path("docs").glob("*/*.md")
              if path.name != "README.md"
          }
          if not expected:
              raise SystemExit("No documentation pages found")
          for page in sorted(expected):
              if page not in pages or page not in node_ids or not pages[page].get("html"):
                  raise SystemExit(f"Missing rendered page or graph node: {page}")
              if f"index.html#{page}" not in tree:
                  raise SystemExit(f"Missing tree navigation: {page}")
          for name in ("index.html", "resources.html", "tree.html", "assets/site/app.js", "assets/site/app.css"):
              if not Path(name).is_file() or Path(name).stat().st_size == 0:
                  raise SystemExit(f"Missing or empty website file: {name}")
          print(f"Verified {len(expected)} documentation pages in the reader, graph, and tree")
          PY

      - name: Assemble public website
        run: |
          mkdir -p _site
          cp index.html resources.html tree.html _site/
          cp -R assets docs resources _site/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
